<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<meta name="color-scheme" content="dark">
<title>FX Terminal</title>
<meta name="description" content="Analyse fondamentale des devises : calendrier économique, discours des banques centrales et événements macro.">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&family=Roboto:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ===== Écran de connexion (affiché tant qu'il n'y a pas de session) ===== -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <p class="login-text">Connecte-toi avec ton compte Google pour accéder à l'application.</p>
    <button type="button" class="btn-google" id="googleSignInBtn">
      <svg class="btn-google-icon" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      <span>Continuer avec Google</span>
    </button>
    <p class="login-note" id="loginNote" hidden></p>
  </div>
</div>

<!-- ===== Appli (masquée tant que non connecté) ===== -->
<div id="appShell" hidden>

<!-- ===== Barre de navigation ===== -->
<header class="topbar">
  <button type="button" class="burger" id="burgerBtn" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sideMenu">
    <span></span><span></span><span></span>
  </button>

  <div class="clocks" aria-label="Heures des sessions de trading">
    <button type="button" class="squawk-toggle" id="squawkToggle" aria-pressed="false" title="Squawk coupé (clique pour activer)" aria-label="Activer ou couper le squawk">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path class="sq-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="sq-wave" d="M18.5 5.5a9 9 0 0 1 0 13"/><path class="sq-off" d="M16 9l6 6M22 9l-6 6"/></svg>
    </button>
    <div class="clock">
      <span class="clock-city">New York</span>
      <span class="clock-time" id="clock-ny">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">London</span>
      <span class="clock-time" id="clock-ldn">--:--:--</span>
    </div>
    <div class="clock">
      <span class="clock-city">Tokyo</span>
      <span class="clock-time" id="clock-tky">--:--:--</span>
    </div>
  </div>

  <div class="session-badge" id="sessionBadge">
    <span id="sessionLabel">—</span>
  </div>
</header>

<!-- ===== Barre de filtres (visible uniquement dans l'onglet Nouveau) ===== -->
<div class="filterbar" id="newsFilterbar">
  <div class="filter-dd" id="newsCurrencyDd">
    <button type="button" class="filter-dd-btn" id="newsCurrencyBtn" aria-haspopup="true" aria-expanded="false" aria-controls="newsCurrencyMenu">
      <span class="filter-dd-label" id="newsCurrencyLabel">Devise</span>
      <span class="filter-dd-arrow" aria-hidden="true"></span>
    </button>
    <div class="filter-dd-menu" id="newsCurrencyMenu" role="group" aria-label="Devises" hidden></div>
  </div>

  <div class="news-period">
    <button type="button" class="news-date-btn" id="newsDateBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="newsCal" aria-label="Choisir la période"></button>
    <span class="news-period-label" id="newsPeriodLabel"></span>
  </div>

  <div class="news-cal" id="newsCal" role="dialog" aria-label="Choisir la période" hidden></div>
</div>

<nav class="side-menu" id="sideMenu" aria-hidden="true">
  <button type="button" class="menu-close" id="menuCloseBtn">Fermer ✕</button>

  <!-- Groupes et fenêtres : construits par windows.js (liste MENU) -->
  <div class="menu-list" id="menuList"></div>

  <button type="button" class="menu-tab menu-tab--deconnexion" id="logoutBtn">
    <svg class="menu-tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="butt" aria-hidden="true">
      <path d="M12 3V12"/>
      <path d="M7.41 6.45A8 8 0 1 0 16.59 6.45"/>
    </svg>
    <span>Déconnexion</span>
  </button>
</nav>

<main class="app-main">

  <!-- Fenêtre Calendar : barre des devises et panneaux construits par windows.js -->
  <section class="tab-panel" id="tab-calendar" role="tabpanel" aria-label="Calendar" hidden>
    <div class="calendar-toolbar">
      <span class="calendar-toolbar-title">Calendrier</span>
      <div class="calendar-toolbar-tools">
        <div class="calendar-impact-toggle" id="calendarImpactToggle" role="radiogroup" aria-label="Filtrer par impact">
          <button type="button" class="calendar-impact-toggle-btn" data-value="medium" role="radio" aria-label="Impact orange uniquement">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--medium"></span>
          </button>
          <button type="button" class="calendar-impact-toggle-btn" data-value="both" role="radio" aria-label="Impact orange et rouge">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--medium"></span><span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--high"></span>
          </button>
          <button type="button" class="calendar-impact-toggle-btn" data-value="high" role="radio" aria-label="Impact rouge uniquement">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--high"></span>
          </button>
          <span class="calendar-impact-toggle-knob" aria-hidden="true"></span>
        </div>
        <div class="calendar-view-filters" id="calendarViewFilters" role="group" aria-label="Filtrer par état de sortie et par date">
          <label class="calendar-view-chip"><input type="checkbox" data-filter="released" checked><span>Sortie</span></label>
          <label class="calendar-view-chip"><input type="checkbox" data-filter="nearby" checked><span>Aujourd'hui + demain</span></label>
          <label class="calendar-view-chip"><input type="checkbox" data-filter="forecast" checked><span>Prévisions</span></label>
        </div>
        <button type="button" class="calendar-translate-btn" id="calendarTranslateBtn" aria-pressed="false" aria-label="Traduire automatiquement les annonces en anglais">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="2.5" width="10" height="10" rx="2.5"/>
            <text x="7.5" y="10.3" font-family="var(--sans)" font-size="6.5" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">文</text>
            <circle cx="17" cy="17" r="5.5" fill="none"/>
            <text x="17" y="19.7" font-family="var(--sans)" font-size="7" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">A</text>
          </svg>
        </button>
      </div>
    </div>
    <div class="calendar-status" id="calendarStatus" hidden></div>
    <div class="currency-panels"></div>
  </section>

  <section class="tab-panel" id="tab-5" role="tabpanel" aria-label="Note fondamentale" hidden>
    <div class="fund-toolbar">
      <span class="fund-toolbar-title">Note fondamentale</span>
      <button type="button" class="fund-primary-btn" id="fundAddGroupBtn">+ Groupe</button>
    </div>
    <p class="fund-status" id="fundStatus" role="status" hidden></p>
    <div class="fund-tree" id="fundTree" aria-live="polite"></div>
  </section>

  <section class="tab-panel is-active" id="tab-4" role="tabpanel" aria-label="Nouveau">
    <div class="calendar-toolbar">
      <span class="calendar-toolbar-title">Nouveau</span>
      <div class="calendar-toolbar-tools">
        <div class="calendar-impact-toggle" role="radiogroup" aria-label="Filtrer par impact">
          <button type="button" class="calendar-impact-toggle-btn" data-value="medium" role="radio" aria-label="Impact orange uniquement">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--medium"></span>
          </button>
          <button type="button" class="calendar-impact-toggle-btn" data-value="both" role="radio" aria-label="Impact orange et rouge">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--medium"></span><span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--high"></span>
          </button>
          <button type="button" class="calendar-impact-toggle-btn" data-value="high" role="radio" aria-label="Impact rouge uniquement">
            <span class="calendar-impact-toggle-dot calendar-impact-toggle-dot--high"></span>
          </button>
          <span class="calendar-impact-toggle-knob" aria-hidden="true"></span>
        </div>
        <button type="button" class="calendar-translate-btn" aria-pressed="false" aria-label="Traduire automatiquement les annonces en anglais">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.5" y="2.5" width="10" height="10" rx="2.5"/>
            <text x="7.5" y="10.3" font-family="var(--sans)" font-size="6.5" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">文</text>
            <circle cx="17" cy="17" r="5.5" fill="none"/>
            <text x="17" y="19.7" font-family="var(--sans)" font-size="7" font-weight="700" text-anchor="middle" stroke="none" fill="currentColor">A</text>
          </svg>
        </button>
      </div>
    </div>
    <div class="news-toolbar-info" id="newsInfo"></div>
    <div id="newsCalendar" aria-live="polite"></div>
    <div id="newsSpeeches"></div>
  </section>

  <section class="tab-panel" id="tab-3" role="tabpanel" aria-label="Paramètres" hidden>
    <div class="settings-row">
      <span class="settings-label">Thème</span>
      <button type="button" class="settings-btn" id="themeBtn">Thème</button>
    </div>
  </section>

</main>

<!-- ===== Panneau Thème & Mode Stylo (plein écran) ===== -->
<div class="theme-panel" id="themePanel" hidden>
  <div class="theme-panel-card">
    <div class="theme-panel-topbar">
      <span class="theme-panel-title">Thème</span>
      <div class="theme-panel-actions">
        <button type="button" class="theme-pill-btn" id="themePanelToggleBtn">Thème</button>
      </div>
    </div>

    <div class="theme-panel-body">
      <div class="theme-accordion" data-section="connexion">
        <button type="button" class="theme-accordion-row" data-section="connexion">
          <span class="chevron">›</span> Connexion
        </button>
        <div class="theme-accordion-content" id="themeFields-connexion"></div>
      </div>

      <div class="theme-accordion" data-section="nouveau">
        <button type="button" class="theme-accordion-row" data-section="nouveau">
          <span class="chevron">›</span> Nouveau
        </button>
        <div class="theme-accordion-content" id="themeFields-nouveau"></div>
      </div>

      <div class="theme-accordion" data-section="general">
        <button type="button" class="theme-accordion-row" data-section="general">
          <span class="chevron">›</span> Général
        </button>
        <div class="theme-accordion-content" id="themeFields-general"></div>
      </div>

      <!-- Un onglet par fenêtre : construit par theme-colors.js à partir de la liste de windows.js -->
      <div id="themeWindowAccordions"></div>

      <div class="theme-accordion" data-section="parametres">
        <button type="button" class="theme-accordion-row" data-section="parametres">
          <span class="chevron">›</span> Paramètres
        </button>
        <div class="theme-accordion-content" id="themeFields-parametres"></div>
      </div>

      <div class="theme-panel-footer">
        <button type="button" class="theme-footer-btn theme-footer-btn--primary" id="applySettingsBtn">✓ Appliquer</button>
        <button type="button" class="theme-footer-btn" id="resetSettingsBtn">↻ Réinitialiser</button>
        <button type="button" class="theme-footer-btn" id="collapseColorsBtn">▲ Replier les couleurs</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== Sélecteur de couleur (une seule instance, réutilisée pour tous les champs) ===== -->
<div class="cp-overlay" id="cpOverlay">
  <div class="cp-modal">
    <div class="cp-title" id="cpTitle">COULEUR</div>
    <div class="cp-sw" id="cpWrap"><canvas id="cpCanvas"></canvas><div class="cp-cursor" id="cpCursor" style="left:100%;top:0%"></div></div>
    <label class="cp-hue-lbl">TEINTE</label>
    <input type="range" class="cp-hue" id="cpHue" min="0" max="360" value="0">
    <div class="cp-prev-row">
      <div class="cp-swatch" id="cpSwatch"></div>
      <input class="cp-hex" type="text" id="cpHex" maxlength="7" placeholder="#000000">
      <span class="cp-hex-lbl">HEX</span>
    </div>
    <div class="cp-mem-lbl">RÉCENTES</div>
    <div class="cp-mem" id="cpMem"></div>
    <div class="cp-btns">
      <button type="button" class="cp-btn cp-btn--ghost" id="cpCancelBtn">Annuler</button>
      <button type="button" class="cp-btn cp-btn--primary" id="cpConfirmBtn">Appliquer</button>
    </div>
  </div>
</div>

</div><!-- /#appShell -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<div class="save-spinner" id="saveSpinner" aria-hidden="true"></div>

<!-- ===== Boîte de dialogue de « Analyse fondamentale » (nom / confirmation) ===== -->
<div class="fund-dialog" id="fundDialog" hidden>
  <div class="fund-dialog-card" role="dialog" aria-modal="true" aria-labelledby="fundDialogTitle">
    <div class="fund-dialog-title" id="fundDialogTitle"></div>
    <p class="fund-dialog-message" id="fundDialogMessage" hidden></p>
    <input class="fund-dialog-input" id="fundDialogInput" type="text" maxlength="80" autocomplete="off" aria-label="Nom" hidden>
    <p class="fund-dialog-error" id="fundDialogError" hidden></p>
    <button type="button" class="fund-dialog-custom-toggle" id="fundDialogCustomToggle" aria-expanded="false" aria-controls="fundDialogCustom" hidden>Personnaliser</button>
    <div class="fund-dialog-custom" id="fundDialogCustom" hidden>
      <div class="fund-dialog-preview" id="fundDialogPreview">Aperçu</div>
      <div class="fund-dialog-color-row"><span>Fond</span><button type="button" class="fund-dialog-swatch" data-key="bg" aria-label="Couleur de fond"></button></div>
      <div class="fund-dialog-color-row"><span>Bordure</span><button type="button" class="fund-dialog-swatch" data-key="border" aria-label="Couleur de la bordure"></button></div>
      <div class="fund-dialog-color-row"><span>Texte</span><button type="button" class="fund-dialog-swatch" data-key="text" aria-label="Couleur du texte"></button></div>
      <button type="button" class="fund-dialog-color-reset" id="fundDialogColorReset">Remettre les couleurs par défaut</button>
    </div>
    <div class="fund-dialog-btns">
      <button type="button" class="fund-dialog-btn fund-dialog-btn--cancel" id="fundDialogCancel">Annuler</button>
      <button type="button" class="fund-dialog-btn fund-dialog-btn--ok" id="fundDialogOk">Valider</button>
    </div>
  </div>
</div>

<script src="./supabase-config.js" defer></script>
<script src="./auth.js" defer></script>
<script src="./theme-colors.js" defer></script>
<script src="./windows.js" defer></script>
<script src="./speeches.js" defer></script>
<script src="./risk.js" defer></script>
<script src="./trump.js" defer></script>
<script src="./period-calendar.js" defer></script>
<script src="./newsfeed.js" defer></script>
<script src="./indicator.js" defer></script>
<script src="./rates.js" defer></script>
<script src="./cot.js" defer></script>
<script src="./retail.js" defer></script>
<script src="./fundamental.js" defer></script>
<script src="./seasonality.js" defer></script>
<script src="./globe.js" defer></script>
<script src="./marketwatch.js" defer></script>
<script src="./bankpos.js" defer></script>
<script src="./app.js" defer></script>
</body>
</html>
